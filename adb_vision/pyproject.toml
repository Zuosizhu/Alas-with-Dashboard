[project]
name = "adb-vision"
version = "0.1.0"
description = "Clean ADB + VLM-driven game automation — no ALAS dependency"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.0.0b1",
    "pillow>=10.0.0",
    "aiofiles>=25.1.0",
]

[tool.hatch.build.targets.wheel]
only-include = ["server.py", "screenshot.py", "__init__.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
