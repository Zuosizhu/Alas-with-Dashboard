[project]
name = "alas-mcp-server"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.0.0b1",
    "pillow>=10.0.0",
    "lz4>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
