[project]
name = "alas-mcp-server"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.0.0b1",
    "pillow>=10.0.0",
    "lz4>=4.0.0",
    "inflection>=0.5.1",
    "adbutils>=2.12.0",
    "uiautomator2>=3.5.0",
    "requests>=2.32.5",
    "pyyaml>=6.0.3",
    "alas-webapp==0.3.7",
    "onepush==1.4.0",
    "pypresence==4.2.1",
    "uiautomator2cache==0.3.0.1",
    "cached-property>=2.0.1",
    "aiofiles>=25.1.0",
    "av>=16.1.0",
    "logzero>=1.7.0",
    "retrying>=1.4.2",
    "opencv-python>=4.13.0.90",
    "pydantic-settings>=2.12.0",
    "pydantic[email]>=2.12.5",
    "pywebio>=1.8.4",
    "matplotlib>=3.10.8",
    "scipy>=1.15.3",
    "psutil>=7.2.1",
    "imageio>=2.37.2",
    "pyzmq>=27.1.0",
    "packaging>=26.0",
    "rich>=13.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
