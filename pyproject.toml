[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "azurlaneautoscript"
version = "0.1.0"
description = "Azur Lane bot with GUI, designed for 24/7 running scenes"
authors = [
    { name = "LmeSzinc" },
]
license = "GPL-3.0"
readme = "README.md"
requires-python = ">=3.9"
keywords = ["azurlane", "automation", "bot"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy==1.26.4",
    "scipy==1.11.4",
    "pillow==10.2.0",
    "opencv-python==4.9.0.80",
    "imageio==2.27.0",
    "adbutils==0.11.0",
    "uiautomator2==2.16.17",
    "uiautomator2cache==0.3.0.1",
    "wrapt==1.16.0",
    "retrying",
    "cached-property",
    "lz4",
    "av==12.3.0",
    "psutil==5.9.8",
    "rich==11.2.0",
    "pygments",
    "tqdm",
    "jellyfish==1.0.3",
    "pyyaml==6.0.1",
    "inflection",
    "pydantic==1.10.13",
    "aiofiles",
    "prettytable==2.2.1",
    "anyio==1.3.1",
    "onepush==1.4.0",
    "pycryptodome==3.20.0",
    "pypresence==4.2.1",
    "pywebio==1.6.2",
    "user-agents",
    "ua-parser",
    "ua-parser-builtins",
    "tornado",
    "starlette==0.14.2",
    "uvicorn[standard]==0.17.6",
    "alas-webapp==0.3.7",
    "zerorpc==0.6.3",
    "pyzmq==25.1.2",
]

[project.urls]
Homepage = "https://github.com/LmeSzinc/AzurLaneAutoScript"
Repository = "https://github.com/LmeSzinc/AzurLaneAutoScript"
Documentation = "https://github.com/LmeSzinc/AzurLaneAutoScript/wiki"

[project.scripts]
alas = "alas:main"
