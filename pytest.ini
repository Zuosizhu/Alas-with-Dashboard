[pytest]
# This repo includes multiple ALAS copies (baseline/wrapped/upstream) that contain
# dev/manual scripts matching pytest's default patterns (e.g. *_test.py) and
# duplicate test module basenames (e.g. installer_test.py). Root-level collection
# is therefore intentionally restricted to the orchestrator test suite.

testpaths =
    agent_orchestrator

# Only collect tests named like test_*.py (prevents collecting *_test.py scripts)
python_files =
    test_*.py

addopts = -ra

norecursedirs =
    .*
    build
    dist
    alas_baseline
    alas_wrapped
    upstream_alas
